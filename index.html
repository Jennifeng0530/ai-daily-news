<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI行业每日资讯</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --tag-red: #dc2626;
    --tag-blue: #2563eb;
    --tag-gray: #6b7280;
    --tag-red-bg: #fef2f2;
    --tag-blue-bg: #eff6ff;
    --tag-gray-bg: #f3f4f6;
    --radius: 6px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  .header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .header h1 {
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--text);
  }
  .header .date {
    font-size: 0.85rem;
    color: var(--text-secondary);
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 6px 16px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--card-bg);
    color: var(--text-secondary);
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .main {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }
  .stats {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }
  .news-list { display: flex; flex-direction: column; gap: 12px; }
  .news-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    transition: box-shadow 0.15s;
  }
  .news-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .news-card-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 6px;
  }
  .news-card-header .tag {
    flex-shrink: 0;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .tag-zhongdian { color: var(--tag-red); background: var(--tag-red-bg); }
  .tag-tourong    { color: var(--tag-blue); background: var(--tag-blue-bg); }
  .tag-qita       { color: var(--tag-gray); background: var(--tag-gray-bg); }
  .news-card-title {
    font-size: 0.95rem;
    font-weight: 500;
    line-height: 1.5;
  }
  .news-card-title a {
    color: var(--text);
    text-decoration: none;
  }
  .news-card-title a:hover { color: var(--accent); }
  .news-card-meta {
    display: flex;
    gap: 12px;
    font-size: 0.78rem;
    color: var(--text-secondary);
    margin-top: 6px;
  }
  .news-card-summary {
    font-size: 0.82rem;
    color: var(--text-secondary);
    margin-top: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .news-card-keywords {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 8px;
  }
  .kw-tag {
    font-size: 0.7rem;
    padding: 1px 6px;
    border-radius: 3px;
    background: #f3f4f6;
    color: #6b7280;
  }
  .loading, .empty, .error {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
    font-size: 0.9rem;
  }
  .source-tag {
    font-size: 0.72rem;
    color: var(--text-secondary);
    background: #f9fafb;
    padding: 1px 6px;
    border-radius: 3px;
  }
  @media (max-width: 640px) {
    .header { padding: 14px 12px; }
    .header h1 { font-size: 1.15rem; }
    .main { padding: 12px 8px 32px; }
    .news-card { padding: 12px 14px; }
    .news-card-title { font-size: 0.9rem; }
  }
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div>
      <h1>AI行业每日资讯</h1>
      <div class="date" id="updateTime"></div>
    </div>
    <nav class="filters" id="filters">
      <button class="filter-btn active" data-cat="all">全部</button>
      <button class="filter-btn" data-cat="key_news">重点资讯</button>
      <button class="filter-btn" data-cat="funding">投融资</button>
      <button class="filter-btn" data-cat="other">其他</button>
    </nav>
  </div>
</header>
<main class="main">
  <div class="stats" id="stats"></div>
  <div class="news-list" id="newsList">
    <div class="loading">加载中…</div>
  </div>
</main>
<script>
(function() {
  const TAG_CLASS = {
    "key_news": "tag-zhongdian",
    "funding":   "tag-tourong",
    "other": "tag-qita"
  };
  const TAG_LABEL = {
    "key_news": "重点",
    "funding":   "投融资",
    "other": "其他"
  };

  let allArticles = [];
  let currentFilter = "all";

  async function fetchNews() {
    try {
      const resp = await fetch("data/news.json");
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      allArticles = await resp.json();
    } catch (e) {
      document.getElementById("newsList").innerHTML =
        '<div class="error">数据加载失败，请稍后刷新页面。</div>';
      console.error(e);
      return;
    }
    if (!allArticles.length) {
      document.getElementById("newsList").innerHTML =
        '<div class="empty">暂无资讯数据。</div>';
      return;
    }
    render();
  }

  function render() {
    const filtered = currentFilter === "all"
      ? allArticles
      : allArticles.filter(a => a.category === currentFilter);

    // 更新统计
    const allCounts = {};
    allArticles.forEach(a => { allCounts[a.category] = (allCounts[a.category]||0)+1; });
    const statsParts = [`共 ${allArticles.length} 条`];
    for (const [cat, n] of Object.entries(allCounts)) {
      statsParts.push(`${TAG_LABEL[cat] || cat} ${n} 条`);
    }
    document.getElementById("stats").textContent = statsParts.join("  ·  ");

    // 按日期倒序（同日内保持分类优先排序）
    const sorted = [...filtered].sort((a, b) => {
      if (a.date !== b.date) return b.date.localeCompare(a.date);
      const order = { "重点资讯": 0, "投融资": 1, "其他资讯": 2 };
      return (order[a.category] ?? 99) - (order[b.category] ?? 99);
    });

    const listEl = document.getElementById("newsList");
    if (!sorted.length) {
      listEl.innerHTML = '<div class="empty">该分类暂无资讯。</div>';
      return;
    }

    listEl.innerHTML = sorted.map(article => {
      const tagCls = TAG_CLASS[article.category] || "tag-qita";
      const tagLabel = TAG_LABEL[article.category] || article.category;
      const kwTags = (article.keywords || []).map(k =>
        `<span class="kw-tag">${escapeHtml(k)}</span>`
      ).join("");
      return `
        <article class="news-card">
          <div class="news-card-header">
            <span class="tag ${tagCls}">${tagLabel}</span>
            <span class="news-card-title">
              <a href="${escapeHtml(article.link)}" target="_blank" rel="noopener">
                ${escapeHtml(article.title)}
              </a>
            </span>
          </div>
          ${article.summary ? `<div class="news-card-summary">${escapeHtml(article.summary)}</div>` : ""}
          <div class="news-card-meta">
            <span class="source-tag">${escapeHtml(article.source)}</span>
            <span>${escapeHtml(article.date)}</span>
          </div>
          ${kwTags ? `<div class="news-card-keywords">${kwTags}</div>` : ""}
        </article>`;
    }).join("");
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // 筛选按钮事件
  document.getElementById("filters").addEventListener("click", e => {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.cat;
    render();
  });

  // 更新日期
  const now = new Date();
  document.getElementById("updateTime").textContent =
    `更新于 ${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;

  fetchNews();
})();
</script>
</body>
</html>
